<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gioco Animali Kids</title>

<style>
body{
    font-family: 'Comic Sans MS', Arial;
    background: linear-gradient(to bottom, #a8e6cf, #dcedc1);
    margin:0;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

h2{
    background:#ff8b94;
    color:white;
    padding:12px;
    border-radius:15px;
}

img{
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:20px;
    margin:10px 0;
}

.card{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

input{
    width:90%;
    padding:12px;
    font-size:18px;
    border-radius:10px;
    border:2px solid #ccc;
}

button{
    padding:15px;
    margin:8px;
    width:90%;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#ffaaa5;
    color:white;
}

.correct{ background:#a5d6a7; }
.wrong{ background:#ef9a9a; }

.footer{
    margin-top:20px;
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<div class="container">

<h2>🐾 Gioco degli Animali</h2>

<img id="img">

<div class="card" id="domande"></div>
<div class="card" id="quiz"></div>
<div class="card" id="soluzioni" style="display:none;"></div>

<button onclick="estrai()">🎴 Nuova carta</button>
<button onclick="controlla()">✅ Controlla quiz</button>
<button onclick="mostraRisposte()">👀 Mostra risposte</button>

<div class="footer">📚 App didattica di Massimiliano Cuccarano</div>

</div>

<script>

// 🐾 ANIMALI CON VERTEBRATI / INVERTEBRATI
const animali = [
{"nome":"Leone","vertebrato":"vertebrato","classe":"Mammifero","ambiente":"Savana","respirazione":"Polmoni","riproduzione":"Viviparo","movimento":"Corre","temperatura":"Omeotermo","nutrizione":"Carne","categoria":"carnivoro","img":"immagini/leone.jpg"},
{"nome":"Elefante","vertebrato":"vertebrato","classe":"Mammifero","ambiente":"Savana","respirazione":"Polmoni","riproduzione":"Viviparo","movimento":"Cammina","temperatura":"Omeotermo","nutrizione":"Erba","categoria":"erbivoro","img":"immagini/elefante.jpg"},
{"nome":"Aquila","vertebrato":"vertebrato","classe":"Uccello","ambiente":"Montagna","respirazione":"Polmoni","riproduzione":"Oviparo","movimento":"Vola","temperatura":"Omeotermo","nutrizione":"Carne","categoria":"carnivoro","img":"immagini/aquila.jpg"},
{"nome":"Serpente","vertebrato":"vertebrato","classe":"Rettile","ambiente":"Foresta","respirazione":"Polmoni","riproduzione":"Oviparo","movimento":"Striscia","temperatura":"Eterotermo","nutrizione":"Carne","categoria":"carnivoro","img":"immagini/serpente.jpg"},
{"nome":"Rana","vertebrato":"vertebrato","classe":"Anfibio","ambiente":"Stagno","respirazione":"Polmoni e pelle","riproduzione":"Oviparo","movimento":"Salta","temperatura":"Eterotermo","nutrizione":"Insetti","categoria":"carnivoro","img":"immagini/rana.jpg"},
{"nome":"Squalo","vertebrato":"vertebrato","classe":"Pesce","ambiente":"Oceano","respirazione":"Branchie","riproduzione":"Ovoviviparo","movimento":"Nuota","temperatura":"Eterotermo","nutrizione":"Pesce","categoria":"carnivoro","img":"immagini/squalo.jpg"},

{"nome":"Farfalla","vertebrato":"invertebrato","classe":"Insetto","ambiente":"Giardino","respirazione":"Trachee","riproduzione":"Oviparo","movimento":"Vola","temperatura":"Eterotermo","nutrizione":"Nettare","categoria":"erbivoro","img":"immagini/farfalla.jpg"},
{"nome":"Granchio","vertebrato":"invertebrato","classe":"Crostaceo","ambiente":"Mare","respirazione":"Branchie","riproduzione":"Oviparo","movimento":"Cammina","temperatura":"Eterotermo","nutrizione":"Onnivoro","categoria":"onnivoro","img":"immagini/granchio.jpg"}
];

// 🧠 QUIZ NUOVI
const quiz = [
{domanda:"Gli animali con colonna vertebrale sono...", risposta:"vertebrati"},
{domanda:"Gli animali senza colonna vertebrale sono...", risposta:"invertebrati"},
{domanda:"Che cos'è l'endoscheletro?", risposta:"scheletro interno al corpo"},
{domanda:"Che cos'è l'esoscheletro?", risposta:"scheletro esterno che protegge il corpo"},
{domanda:"A cosa serve lo scheletro?", risposta:"sostiene il corpo protegge gli organi e permette il movimento"},
{domanda:"Che cos'è la colonna vertebrale?", risposta:"una struttura di ossa che sostiene il corpo e protegge il midollo"}
];

let corrente;
let domandaQuiz;

// 🎴 ESTRAZIONE
function estrai(){
    corrente = animali[Math.floor(Math.random()*animali.length)];
    domandaQuiz = quiz[Math.floor(Math.random()*quiz.length)];

    document.getElementById("img").src = corrente.img;

    document.getElementById("domande").innerHTML = `
    <h3>${corrente.nome}</h3>
    Classe: ${corrente.classe}<br>
    Tipo: ${corrente.vertebrato}<br><br>
    🎤 Rispondi a voce:<br>
    • Dove vive?<br>
    • Come respira?<br>
    • Come si riproduce?<br>
    • Come si muove?<br>
    • Temperatura?<br>
    • Cosa mangia?<br>
    `;
    
    document.getElementById("quiz").innerHTML = `
    <h3>🧠 Quiz</h3>
    ${domandaQuiz.domanda}<br>
    <input id="quizRisposta">
    `;

    document.getElementById("soluzioni").style.display = "none";
}

// 🎯 CONTROLLO
function controlla(){
    let input = document.getElementById("quizRisposta");
    let user = input.value.toLowerCase();
    let risposta = domandaQuiz.risposta.toLowerCase();

    if(user.includes(risposta.split(" ")[0])){
        input.className = "correct";
    } else {
        input.className = "wrong";
    }
}

// 👀 RISPOSTE
function mostraRisposte(){
    let box = document.getElementById("soluzioni");
    box.style.display = "block";

    box.innerHTML = `
    <h3>📘 Risposte</h3>
    Ambiente: ${corrente.ambiente}<br>
    Respirazione: ${corrente.respirazione}<br>
    Riproduzione: ${corrente.riproduzione}<br>
    Movimento: ${corrente.movimento}<br>
    Temperatura: ${corrente.temperatura}<br>
    Nutrizione: ${corrente.nutrizione}<br>
    Gruppo: ${corrente.categoria}<br>
    Tipo: ${corrente.vertebrato}<br><br>
    <b>Quiz:</b> ${domandaQuiz.risposta}
    `;
}

</script>

</body>
</html>
